server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /resources/ {
        proxy_pass https://ui5.sap.com/resources/;
        proxy_ssl_server_name on;
        proxy_set_header Host ui5.sap.com;
    }

    location /test-resources/ {
        proxy_pass https://ui5.sap.com/test-resources/;
        proxy_ssl_server_name on;
        proxy_set_header Host ui5.sap.com;
    }

        location ~ ^/(auth|dashboard|employees|departments|users|leave-requests|personal-data)(/.*)?$ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
